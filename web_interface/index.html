<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiGen - Pure Cinematic Engine</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <button id="sidebar-toggle" class="glass">
        <span id="toggle-icon">❮</span>
    </button>

    <div class="ui-overlay">
        <header>
            <h1>Point<span>Gen</span></h1>
            <div class="subtitle-container">
                <p>Kinetic Pointillism v4.0</p>
                <div id="backend-status-container">
                    <span id="glb-indicator" style="display:none; background: var(--accent-color); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; letter-spacing: 1px;">TRUE 3D</span>
                    <span id="backend-status"></span>
                    <span id="fps-counter">60 FPS</span>
                    <span id="load-time" style="font-family: monospace; font-size: 0.7rem; color: var(--weight-secondary); margin-left: 8px;"></span>
                </div>
            </div>
        </header>

        <div class="sidebar glass" id="sidebar">
            <div class="section">
                <h3>System Controls</h3>
                <div class="upload-btn-wrapper">
                    <button class="btn btn-primary">Load Source</button>
                    <input type="file" id="file-input" accept="image/*" />
                </div>
            </div>

            <div class="section">
                <h3>View Controls</h3>
                <button id="reset-view" class="btn glass" style="width: 100%; margin-bottom: 0.5rem; border: 1px solid var(--glass-border); background:rgba(255,255,255,0.02); color: var(--weight-primary);">Reset Perspective</button>
            </div>

            <div class="section">
                <h3>Visual Mode</h3>
                <div class="mode-selector" id="render-modes">
                    <button class="mode-btn active" data-render="points">Points</button>
                    <button class="mode-btn" data-render="ascii">ASCII</button>
                    <button class="mode-btn" data-render="hybrid">Hybrid</button>
                </div>
            </div>

            <div class="section">
                <h3>Character Signature</h3>
                <div class="mode-selector" id="char-sets">
                    <button class="mode-btn active" data-set="default">Default</button>
                    <button class="mode-btn" data-set="reverse">Reverse</button>
                    <button class="mode-btn" data-set="pointism">Pointillistic</button>
                    <button class="mode-btn" data-set="detailed">Detailed (70ch)</button>
                </div>
            </div>

            <div class="section">
                <h3>Preprocessing Filter</h3>
                <div class="mode-selector" id="kernel-filters">
                    <button class="mode-btn active" data-kernel="edges">Standard Edges</button>
                    <button class="mode-btn" data-kernel="sharpen">Fine Sharpen</button>
                    <button class="mode-btn" data-kernel="emboss">3D Relief</button>
                    <button class="mode-btn" data-kernel="gaussian">Gaussian Soften</button>
                </div>
            </div>

            <div class="section">
                <h3>Motion Dynamics</h3>
                <div class="mode-selector" id="physics-modes">
                    <button class="mode-btn active" data-mode="grid">Static</button>
                    <button class="mode-btn" data-mode="drift">Drift</button>
                    <button class="mode-btn" data-mode="vortex">Vortex</button>
                </div>
            </div>

            <div class="section">
                <h3>Simulation Params</h3>
                <div class="control-item">
                    <div class="label-row">
                        <label>Interaction Range</label>
                        <span class="val-display" id="flee-val">150</span>
                    </div>
                    <input type="range" id="flee-slider" min="20" max="600" value="150" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row">
                        <label>Particle Density</label>
                        <span class="val-display" id="res-val">28</span>
                    </div>
                    <input type="range" id="res-slider" min="1" max="29" value="28" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row">
                        <label>View Depth (Zoom)</label>
                        <span class="val-display" id="zoom-val">1200</span>
                    </div>
                    <input type="range" id="zoom-slider" min="400" max="3000" value="1200" class="asterisk-slider">
                </div>

            </div>

            <div id="3d-controls" style="display:none;">
                <div class="section toggle-section" style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem; margin-top: 1.5rem;">
                    <label class="switch-label">
                        <span>Auto-Orbit</span>
                        <div class="switch">
                            <input type="checkbox" id="auto-rotate-toggle">
                            <span class="slider round"></span>
                        </div>
                    </label>
                </div>
                <div class="section toggle-section" style="margin-top: 1rem;">
                    <label class="switch-label">
                        <span>Drag Interactivity</span>
                        <div class="switch">
                            <input type="checkbox" id="drag-toggle" checked>
                            <span class="slider round"></span>
                        </div>
                    </label>
                </div>
            </div>

            <div class="section toggle-section">
                <label class="switch-label">
                    <span>Flow Reaction</span>
                    <div class="switch">
                        <input type="checkbox" id="flow-toggle">
                        <span class="slider round"></span>
                    </div>
                </label>
            </div>
            <div class="section toggle-section" style="margin-top: 1rem;">
                <label class="switch-label">
                    <span>Character Inversion</span>
                    <div class="switch">
                        <input type="checkbox" id="invert-toggle">
                        <span class="slider round"></span>
                    </div>
                </label>
            </div>
            <div class="section toggle-section" style="margin-top: 1rem;">
                <label class="switch-label">
                    <span>3D Perspective</span>
                    <div class="switch">
                        <input type="checkbox" id="dim-toggle" checked>
                        <span class="slider round"></span>
                    </div>
                </label>
            </div>
        </div>
    </div>

    <script src="tests.js?v=2"></script>
    <script src="UIController.js?v=2"></script>
    <script src="sketch.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiGen - Pure Cinematic Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <div class="ui-overlay">
        <header>
            <h1>Ascii<span>Gen</span></h1>
            <p>Interactive Pointillism Experience</p>
        </header>

        <div class="controls glass">
            <div class="actions">
                <div class="upload-btn-wrapper">
                    <button class="btn">Upload Image</button>
                    <input type="file" id="file-input" accept="image/*" />
                </div>
                <button id="toggle-physics" class="btn secondary">Explode Particles</button>
            </div>

            <div class="slider-group">
                <div class="control-item">
                    <label>Interaction Sensitivity</label>
                    <input type="range" id="flee-slider" min="50" max="400" value="150">
                </div>
                <div class="control-item">
                    <label>Density</label>
                    <input type="range" id="res-slider" min="5" max="30" value="10">
                </div>
            </div>
        </div>
    </div>

    <script src="tests.js"></script>
    <script src="sketch.js"></script>
</body>
</html>

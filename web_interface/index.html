<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiGen - Pure Cinematic Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <div class="ui-overlay">
        <header>
            <h1>Point<span>Gen</span></h1>
            <p>High-Performance Kinetic Pointillism</p>
        </header>

        <div class="controls glass">
            <div class="actions">
                <div class="upload-btn-wrapper">
                    <button class="btn">Choose Image</button>
                    <input type="file" id="file-input" accept="image/*" />
                </div>
                <div class="mode-selector" id="physics-modes">
                    <button class="mode-btn active" data-mode="grid">Origin</button>
                    <button class="mode-btn" data-mode="drift">Drift</button>
                    <button class="mode-btn" data-mode="explode">Explode</button>
                    <button class="mode-btn" data-mode="vortex">Vortex</button>
                </div>
                <div class="stats glass" style="display: flex; align-items: center; justify-content: center;">
                    <span id="backend-status" style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background-color: #ff4444; margin-right: 10px; box-shadow: 0 0 10px #ff4444; transition: 0.3s;" title="Checking Python Status..."></span>
                    <span id="fps-counter">60 FPS</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="control-item">
                    <label>Interaction Sensitivity</label>
                    <input type="range" id="flee-slider" min="20" max="600" value="150">
                </div>
                <div class="control-item">
                    <label>Particle Density</label>
                    <input type="range" id="res-slider" min="2" max="25" value="8">
                </div>
            </div>
        </div>
    </div>

    <script src="tests.js"></script>
    <script src="sketch.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiGen - Pure Cinematic Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <div class="ui-overlay">
        <header>
            <h1>Ascii<span>Gen</span></h1>
            <p>Interactive Pointillism Experience</p>
        </header>

        <div class="controls glass">
            <div class="actions">
                <div class="upload-btn-wrapper">
                    <button class="btn">Choose Image</button>
                    <input type="file" id="file-input" accept="image/*" />
                </div>
                <div class="select-wrapper">
                    <select id="physics-mode" class="btn secondary">
                        <option value="grid">Locked Grid</option>
                        <option value="drift">Organic Drift</option>
                        <option value="explode">Explode Mode</option>
                        <option value="vortex">Vortex Swarm</option>
                    </select>
                </div>
            </div>

            <div class="slider-group">
                <div class="control-item">
                    <label>Interaction Sensitivity</label>
                    <input type="range" id="flee-slider" min="20" max="600" value="150">
                </div>
                <div class="control-item">
                    <label>Particle Density</label>
                    <input type="range" id="res-slider" min="2" max="25" value="8">
                </div>
            </div>
        </div>
    </div>

    <script src="tests.js"></script>
    <script src="sketch.js"></script>
</body>
</html>

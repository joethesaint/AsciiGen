<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PointGen</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="style.css?v=5.2">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/misc/GPUComputationRenderer.js"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <button id="sidebar-toggle" class="glass" aria-label="Toggle controls">
        <span id="toggle-icon">❮</span>
    </button>

    <div class="ui-overlay">
        <header>
            <h1>Point<span>Gen</span></h1>
            <div class="subtitle-container">
                <p>ASCII &amp; particle engine v5.0</p>

                <p class="stat-row"><span id="fps-counter">-- FPS</span> · <span id="stats"></span></p>
                <p id="status-msg" class="status-msg" role="status" aria-live="polite"></p>
            </div>
        </header>

        <div class="sidebar glass" id="sidebar">
            <div class="section">
                <h3>Source</h3>
                <div class="upload-btn-wrapper">
                    <button class="btn btn-primary">Load image or GLB</button>
                    <input type="file" id="file-input" accept="image/*,.glb,.gltf" />
                </div>
                <div class="mode-selector" id="samples">
                    <button class="mode-btn" data-sample="images/3d_outline.glb">Sample GLB</button>
                    <button class="mode-btn" data-sample="images/roman_bust.png">Sample image</button>
                </div>
            </div>

            <div class="section">
                <h3>Render</h3>
                <div class="mode-selector" data-group="render">
                    <button class="mode-btn active" data-value="ascii">ASCII</button>
                    <button class="mode-btn" data-value="particles">Particles</button>
                </div>
            </div>

            <div class="section" data-for="ascii">
                <h3>ASCII</h3>
                <div class="control-item">
                    <div class="label-row"><label for="cell">Cell size</label><span class="val-display" data-out="cell"></span></div>
                    <input type="range" id="cell" min="4" max="28" value="8" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="contrast">Contrast</label><span class="val-display" data-out="contrast"></span></div>
                    <input type="range" id="contrast" min="50" max="250" value="130" class="asterisk-slider">
                </div>
                <div class="mode-selector" data-group="color">
                    <button class="mode-btn active" data-value="mono">Mono</button>
                    <button class="mode-btn" data-value="source">Source colour</button>
                </div>
                <div class="toggle-section">
                    <label class="switch-label"><span>Edge lines  / | \ -</span>
                        <div class="switch"><input type="checkbox" id="edges"><span class="slider round"></span></div>
                    </label>
                </div>
                <div class="toggle-section">
                    <label class="switch-label"><span>Invert</span>
                        <div class="switch"><input type="checkbox" id="invert"><span class="slider round"></span></div>
                    </label>
                </div>
            </div>

            <div class="section" data-for="particles" hidden>
                <h3>Particles</h3>
                <div class="mode-selector" data-group="sprite">
                    <button class="mode-btn active" data-value="dots">Dots</button>
                    <button class="mode-btn" data-value="glyphs">Characters</button>
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="count">Count (thousands)</label><span class="val-display" data-out="count"></span></div>
                    <input type="range" id="count" min="10" max="400" step="10" value="150" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="size">Size</label><span class="val-display" data-out="size"></span></div>
                    <input type="range" id="size" min="3" max="40" value="10" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="force">Cursor force</label><span class="val-display" data-out="force"></span></div>
                    <input type="range" id="force" min="0" max="100" value="35" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="radius">Cursor radius</label><span class="val-display" data-out="radius"></span></div>
                    <input type="range" id="radius" min="5" max="100" value="35" class="asterisk-slider">
                </div>
                <div class="control-item">
                    <div class="label-row"><label for="spring">Snap-back strength</label><span class="val-display" data-out="spring"></span></div>
                    <input type="range" id="spring" min="2" max="40" value="14" class="asterisk-slider">
                </div>
                <div class="mode-selector" data-group="motion">
                    <button class="mode-btn active" data-value="still">Still</button>
                    <button class="mode-btn" data-value="drift">Drift</button>
                    <button class="mode-btn" data-value="vortex">Vortex</button>
                </div>
                <div class="toggle-section">
                    <label class="switch-label"><span>Trails</span>
                        <div class="switch"><input type="checkbox" id="trails"><span class="slider round"></span></div>
                    </label>
                </div>
            </div>

            <div class="section" id="charset-section">
                <h3>Character set</h3>
                <div class="mode-selector" data-group="glyphs">
                    <button class="mode-btn active" data-value="classic">Classic</button>
                    <button class="mode-btn" data-value="detailed">Detailed</button>
                    <button class="mode-btn" data-value="blocks">Blocks</button>
                </div>
            </div>

            <div class="section">
                <h3>View</h3>
                <button id="reset-view" class="btn glass">Reset view</button>
                <div class="toggle-section">
                    <label class="switch-label"><span>Auto-orbit</span>
                        <div class="switch"><input type="checkbox" id="orbit"><span class="slider round"></span></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script src="engine/device.js?v=5.2"></script>
    <script src="engine/glyphs.js?v=5.2"></script>
    <script src="engine/sampler.js?v=5.2"></script>
    <script src="engine/ascii-pass.js?v=5.2"></script>
    <script src="engine/particles.js?v=5.2"></script>
    <script src="engine/sources.js?v=5.2"></script>
    <script src="app.js?v=5.2"></script>
</body>
</html>

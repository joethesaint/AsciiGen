<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsciiGen - Fullscreen Cinematic Engine</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.1/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.1/socket.io.min.js"></script>
</head>
<body>
    <div id="canvas-holder"></div>

    <div class="ui-overlay">
        <div class="header">
            <h1>Ascii<span>Gen</span></h1>
            <div id="status" class="status-dot disconnected"></div>
        </div>

        <div class="actions">
            <div class="upload-btn-wrapper">
                <button class="btn">Choose Image</button>
                <input type="file" id="file-input" accept="image/*" />
            </div>
            <button id="toggle-physics" class="btn secondary">Explode Physics</button>
        </div>

        <div class="controls glass">
            <div class="control-group">
                <label>Sensitivity</label>
                <input type="range" id="flee-slider" min="50" max="300" value="150">
            </div>
            <div class="control-group">
                <label>Character Spacing</label>
                <input type="range" id="res-slider" min="6" max="20" value="10">
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sketch.js') }}"></script>
</body>
</html>

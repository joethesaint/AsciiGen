# Processing options
processing:
  autocontrast: false
  high_quality: false
  font_aspect: 1.0 # Standard pixel sizing constraint without visual correction

# Feature toggles
features:
  color: false
  borders: false
  border_char: "#"

# GitHub profile settings
github:
  width: 540
  lock_aspect: true  # Force 1012x899 ratio
  char_set: "pointism"  # Perfect for dot-style aesthetics

# Output configuration
output:
  width: 360
  char_set: "pointism"
  save_to_file: true
  filename: "output.txt"
